  The tray icon while Network Repair is on (cellular holds the default
  routes). A dark disc with an amber ring and four cellular signal bars, and
  Tux without the handheld: the one icon that reads differently at 16 px
  from the other two. Dark on purpose, no light fill but the penguin's own.
  No clipPath, mask or filter: Qt's SVG renderer, which Plasma draws icons
  with, ignores them.
-->
